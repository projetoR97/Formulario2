<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <link rel="stylesheet" href="style.css">
   <title>Document</title>
</head>
<body>
   
<div class="form-card">
   <!-- Cabeçalho -->
   <div class="form-title">
      <i class="fas fa-user-edit"></i> Cadastro
   </div>
   <div class="form-subtitle">
      Preencha os dados abaixo para criar sua conta
   </div>

   <!-- FORMULÁRIO -->
   <form action="#" method="POST" id="meuFormulario">
      <!-- NOME -->
      <div class="input-group">
         <label for="nome"><i class="fas fa-user"></i> Nome</label>
         <div class="input-wrapper">
            <input type="text" id="nome" name="nome" placeholder="Seu nome completo" required autocomplete="name">
            <i class="fas fa-user-circle"></i>
         </div>
      </div>

      <!-- EMAIL -->
      <div class="input-group">
         <label for="email"><i class="fas fa-envelope"></i> E-mail</label>
         <div class="input-wrapper">
            <input type="email" id="email" name="email" placeholder="exemplo@email.com" required autocomplete="email">
            <i class="fas fa-envelope"></i>
         </div>
      </div>

      <!-- SENHA -->
      <div class="input-group">
         <label for="senha"><i class="fas fa-lock"></i> Senha</label>
         <div class="input-wrapper">
            <input type="password" id="senha" name="senha" placeholder="Mínimo 6 caracteres" required minlength="6"
               autocomplete="new-password">
            <i class="fas fa-lock"></i>
            <!-- ícone decorativo de "olho" (apenas visual) -->
            <i class="fas fa-eye toggle-password"></i>
         </div>
         <small style="display: block; margin-top: 0.3rem; color: #4d7a8f; font-size: 0.75rem; padding-left: 0.5rem;">
            <i class="fas fa-info-circle" style="margin-right: 4px;"></i> A senha deve ter no mínimo 6 caracteres.
         </small>
      </div>

      <!-- BOTÃO ENVIAR -->
      <button type="submit" class="btn-submit">
         <i class="fas fa-paper-plane"></i> Enviar
      </button>
   </form>

   <!-- rodapé informativo (apenas estético) -->
   <div class="form-footer">
      <i class="fas fa-shield-alt" style="margin-right: 6px; color: #3b9bc7;"></i> Seus dados estão seguros.
      <br>
      <span style="font-size: 0.75rem; opacity: 0.7;">Já tem conta? <a href="#">Entrar</a></span>
   </div>
</div>





<script>
   document.getElementById('meuFormulario').addEventListener('submit', async function (e) {
      e.preventDefault();

      // Pega os dados do formulário
      const nome = document.getElementById('nome').value;
      const email = document.getElementById('email').value;
      const senha = document.getElementById('senha').value;

      try {
         const response = await fetch('http://localhost:3000/api/cadastrar', {
            method: 'POST',
            headers: {
               'Content-Type': 'application/json'
            },
            body: JSON.stringify({ nome, email, senha })
         });

         const data = await response.json();

         if (data.success) {
            alert('✅ Cadastro realizado com sucesso!');
            this.reset(); // Limpa o formulário
         } else {
            alert('❌ ' + data.message);
         }
      } catch (error) {
         alert('❌ Erro ao conectar com o servidor');
         console.error('Erro:', error);
      }
   });
</script>



</body>
</html>
